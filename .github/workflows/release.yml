name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Release notes are built from tag-to-tag history, which needs full depth.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match package.json ($package_version)."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification suite
        run: pnpm typecheck && pnpm test && pnpm build && pnpm test:integration

      - name: Create package archive
        run: pnpm pack --pack-destination .artifacts

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            range="${previous_tag}..${GITHUB_REF_NAME}"
            echo "Building notes for $range"
          else
            range="$GITHUB_REF_NAME"
            echo "No previous tag found; using full history"
          fi

          section() {
            local heading="$1" pattern="$2" lines
            lines="$(git log --no-merges --regexp-ignore-case --extended-regexp \
              --grep="$pattern" --pretty=format:'- %s (%h)' "$range")"
            if [[ -n "$lines" ]]; then
              printf '### %s\n\n%s\n\n' "$heading" "$lines" >> RELEASE_NOTES.md
            fi
          }

          # The tag is already validated against package.json, so the archive
          # name is derived rather than guessed from a directory listing.
          archive="dsh-plugin-installer-$(node -p "require('./package.json').version").tgz"

          {
            printf '## dsh-plugin-installer %s\n\n' "$GITHUB_REF_NAME"
            printf 'Install into a DSH profile:\n\n'
            printf '```bash\ndsh plugin --profile web add ./%s\ndsh web\n```\n\n' "$archive"
          } > RELEASE_NOTES.md

          section 'Features' '^feat(\(.+\))?!?:'
          section 'Fixes' '^fix(\(.+\))?!?:'
          section 'Maintenance' '^(chore|docs|refactor|test|build|ci|perf|style)(\(.+\))?!?:'

          other="$(git log --no-merges --extended-regexp \
            --invert-grep --regexp-ignore-case \
            --grep='^(feat|fix|chore|docs|refactor|test|build|ci|perf|style)(\(.+\))?!?:' \
            --pretty=format:'- %s (%h)' "$range")"
          if [[ -n "$other" ]]; then
            printf '### Other changes\n\n%s\n\n' "$other" >> RELEASE_NOTES.md
          fi

          {
            printf '### Verification\n\n'
            printf 'This tag passed `pnpm typecheck`, `pnpm test`, `pnpm build` and `pnpm test:integration` on Node 22.\n\n'
          } >> RELEASE_NOTES.md

          if [[ -n "$previous_tag" ]]; then
            printf '**Full changelog**: %s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$previous_tag" "$GITHUB_REF_NAME" >> RELEASE_NOTES.md
          fi

          # Hand the exact archive path to the publish step.
          echo "RELEASE_ARCHIVE=.artifacts/$archive" >> "$GITHUB_ENV"

          echo '--- generated notes ---'
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_options=()
          # Keep preview builds out of GitHub's /releases/latest response so
          # the one-click installers continue to select stable packages only.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_options+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" "$RELEASE_ARCHIVE" \
            --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md \
            "${release_options[@]}"
